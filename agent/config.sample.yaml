# ============================================================
# LearnLove Agent 配置模板
#
# 使用方法:
#   1. 复制此文件到你的用户数据目录（默认 ~/.learnlove_data/config.yaml）
#   2. 填入你的真实值
#   3. 勿提交真实配置到 git！
#
# 数据目录可在启动时通过 --data-dir 或 LEARNLOVE_USER_DATA 环境变量指定
# ============================================================

# --- 必填: 微信数据 ---
wechat:
  db_dir: "D:\\WeChat\\Record\\xwechat_files\\wxid_xxxxx\\db_storage"
  keys_file: "~/.learnlove_data/.wechat-decrypt/all_keys.json"
  decrypted_dir: "~/.learnlove_data/.wechat-decrypt/decrypted"

# --- 必填: LLM API ---
llm:
  model_profile: "deepseek-v4-flash"  # 可选档案见 models.yaml；网页中也可热切换
  # api_key: "sk-REPLACE_ME"           # 推荐设置 DEEPSEEK_API_KEY；勿提交真实密钥
  # TJU 模型请设置 TJU_API_KEY=tk-...，然后把 model_profile 改为 tju-* 档案
  # 下面字段可选：填写后覆盖 models.yaml 中对应档案的默认值
  # temperature: 0.7
  # max_tokens: 8192
  # thinking: false
  # reasoning_effort: high

# --- 必填: 监听的联系人 ---
contacts: []                      # 启动默认不加载；使用 /contact <名称> 明确指定

# --- 可选: 全局媒体开关（/voice、/image 会持久化本机偏好） ---
media:
  voice_mode: "manual"           # auto | manual
  image_mode: "manual"           # auto | manual

# --- 可选: 媒体识别 ---
# 本地模型和远程 API 都通过 agent.media_api.register_media_provider 注册：
#   speech_to_text      语音转文字
#   image_understanding 图片理解/OCR
# 本地模型由 agent/media_models.json 注册，文件位于 models/media 与 runtime/media。
# 可用 LEARNLOVE_SPEECH_MODEL / LEARNLOVE_VISION_MODEL 选择其他注册模型，
# 或用 LEARNLOVE_MEDIA_REGISTRY 指向另一份注册表。
# 原文件会先保存到用户数据目录 archive/media，处理器不可用时任务不会丢失。
media_api:
  speech_to_text:
    provider: ""
  image_understanding:
    provider: ""

# --- 可选: 阀门 ---
valve:
  level: 1                       # 0=只读 1=建议+剪贴板 2=自动发送

# --- 可选: 智能体参数 ---
agent:
  # 自动模式
  auto:
    enabled: false
    suggestion_count: 3
    auto_copy: false
    auto_send: false             # 需要 valve>=2
    min_interval: 5

  # 上下文
  context:
    max_history_turns: 20         # 压缩时至少保留的近期轮数，不再作为硬裁剪上限
    use_model_context_window: true # 默认使用 models.yaml 的模型窗口（DeepSeek V4 为 1M）
    max_context_tokens: 0          # 仅当上项为 false 时作为手动窗口上限
    compress_older: true

  # 回复
  reply:
    max_length: 200
    style: "warm_caring"

# --- 可选: 记忆 ---
memory:
  enabled: true
  max_memory_chars: 8000
  global_max_memory_chars: 5000
  global_transcript_max_chars: 30000
  global_compact_turns: 30
  transcript_max_chars: 800000    # 压缩触发阈值，同时作为单批上限；不会裁掉超出部分
  compact_turns: 200
  inject_tail_lines: 20

# --- 可选: LearnLove 独立对话账本 ---
conversation:
  restore_messages: 1000          # /restore 恢复到工作上下文的最近消息数，完整原文仍可搜索
# 如 AgentHub 不在项目同级目录，可设置环境变量：
# AGENT_HUB_ARCHIVE_DIR=D:\path\to\AgentHub\data\archives

# --- 可选: 复盘分析 ---
review:
  initial_message_limit: 100       # 首次复盘拉取的消息条数（无历史记录时），最大 200
  include_previous_summary: true   # 是否在分析中注入上次复盘摘要作为上下文
  include_oldest: true             # 首次复盘是否额外拉取最早的一批消息（覆盖相识初期）
  oldest_message_limit: 50         # 最早一批拉多少条

# --- 可选: 活跃技能 ---
active_skills:
  - warm_caring
  # - humorous
  # - conflict_resolution
  # - first_date
  # - goutoujunshi
