# LearnLove 模型目录。终端模式与 AgentHub Web 设置面板共用此文件。
# 密钥优先放环境变量，不要把真实密钥写进仓库。

default: deepseek-v4-flash

models:
  deepseek-v4-flash:
    label: "DeepSeek V4 Flash"
    provider: deepseek
    protocol: openai
    api_base: "https://api.deepseek.com"
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-flash
    thinking: false
    reasoning_effort: high
    temperature: 0.7
    max_tokens: 8192
    max_context_tokens: 1000000
    params: [thinking, reasoning_effort, temperature, max_tokens]

  deepseek-v4-pro:
    label: "DeepSeek V4 Pro"
    provider: deepseek
    protocol: openai
    api_base: "https://api.deepseek.com"
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-pro
    thinking: true
    reasoning_effort: high
    temperature: 0.7
    max_tokens: 8192
    max_context_tokens: 1000000
    params: [thinking, reasoning_effort, temperature, max_tokens]

  deepseek-chat:
    label: "DeepSeek Chat（兼容旧配置）"
    provider: deepseek
    protocol: openai
    api_base: "https://api.deepseek.com"
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-chat
    thinking: false
    temperature: 0.7
    max_tokens: 8192
    max_context_tokens: 1000000
